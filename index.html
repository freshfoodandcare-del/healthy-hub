<script>

function openAccount() {

    const dropdown = document.getElementById("accountDropdown");
    const content = document.getElementById("accountContent");

    const user = JSON.parse(
        localStorage.getItem("healthyHubLoggedInUser")
    );

    if (user) {

        content.innerHTML = `
            <h3>My Account</h3>
            <p class="account-name">👤 ${user.name}</p>
            <p class="account-email">📧 ${user.email}</p>

            <button onclick="logoutUser()" class="logout-btn">
                Logout
            </button>
        `;

    } else {

        content.innerHTML = `
            <h3>My Account</h3>
            <p class="account-login-text">
                You are not logged in.
            </p>

            <a href="login.html" class="signin-btn">
                Sign In
            </a>

            <a href="register.html" class="register-link">
                Create Account
            </a>
        `;
    }

    dropdown.classList.toggle("show");
}


function logoutUser() {

    localStorage.removeItem("healthyHubLoggedInUser");

    alert("You have been logged out.");

    window.location.reload();
}
document.addEventListener("click", function(event) {

    const accountWrapper = document.querySelector(".account-wrapper");
    const dropdown = document.getElementById("accountDropdown");

    if (
        accountWrapper &&
        dropdown &&
        !accountWrapper.contains(event.target)
    ) {
        dropdown.classList.remove("show");
    }

});
</script>
